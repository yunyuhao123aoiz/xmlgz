name: Auto Update EPG Files

on:
  schedule:
    - cron: '50 21 * * *'   # 05:50 BJT
    - cron: '35 2 * * *'    # 10:35 BJT
    - cron: '25 7 * * *'    # 15:25 BJT
  workflow_dispatch:
  pull_request:
    types: [closed]  # 当 PR 合并时也触发更新

permissions:
  contents: write

jobs:
  update:
    # 只在 PR 合并到 main 时运行，或者定时/手动触发时运行
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download EPG files
        run: |
          echo "开始下载 EPG 文件..."

          files=(
            "e.xml.gz"
            "cc.xml.gz"
            "all.xml.gz"
            "allcc.xml.gz"
            "112114.xml.gz"
            "epgpw_cn.xml.gz"
            "epgpw_hk.xml.gz"
            "epgpw_tw.xml.gz"
          )

          failed=0

          for file in "${files[@]}"; do
            echo "下载 $file..."

            # 源站 1：taksssss Gitee（国内推荐，主源）
            if curl -L --fail --max-time 120 -o "$file" \
              "https://gitee.com/taksssss/tv/raw/main/epg/$file"; then
              echo "✅ $file 从 taksssss Gitee 下载成功"

            # 源站 2：kuke31 通过 jsDelivr CDN（备用源）
            elif curl -L --fail --max-time 120 -o "$file" \
              "https://cdn.jsdelivr.net/gh/kuke31/xmlgz@main/$file"; then
              echo "✅ $file 从 kuke31 jsDelivr 下载成功"

            # 源站 3：gh-proxy 代理原始 raw（第三备用源）
            elif curl -L --fail --max-time 120 -o "$file" \
              "https://ghproxy.com/https://raw.githubusercontent.com/kuke31/xmlgz/main/$file"; then
              echo "✅ $file 从 gh-proxy 下载成功"

            else
              echo "⚠️ $file 全部源下载失败，跳过"
              failed=1
              continue
            fi

            size=$(stat -c%s "$file")
            if [ "$size" -lt 100 ]; then
              echo "⚠️ $file 文件太小 ($size 字节)，跳过"
              failed=1
              continue
            fi
            echo "$file 大小: $size 字节"
          done

          if [ "$failed" -eq 1 ]; then
            echo "部分文件下载失败，但继续提交已成功的文件"
          else
            echo "全部文件下载成功"
          fi

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add *.gz

          if git diff --staged --quiet; then
            echo "没有文件更新"
          else
            BEIJING_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
            git commit -m "更新节目单及压缩包-$BEIJING_TIME"
            git push
            echo "✅ 文件已更新"
          fi
